name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        env:
          # Jamendo's client_id is a public usage identifier, not a secret — it
          # is inlined into the bundle at build time by design, so it lives in
          # a repository variable rather than a secret.
          VITE_JAMENDO_CLIENT_ID: ${{ vars.VITE_JAMENDO_CLIENT_ID }}
        run: npm run build

      - name: Add SPA fallback
        # GitHub Pages serves static files with no SPA rewrite, so a hard load
        # of a deep link (e.g. /liris/search) would 404. Serving index.html as
        # 404.html lets the client router take over instead.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
